<script>
  let path = window.location.pathname.split("/");
  let p = [
    ["Font-Installer", /font(-?inst(aller)?)?/i],
    ["Random-Text", /ra?n?do?m(-?te?xt)?|te?xt/i],
    ["ViewVideo", /(view-?)?vid(eo)?/i],
    ["Impostor", /impostor|sus/i],
    ["FrostyHSL", /(frosty-?)?hsl/i],
    ["URL-Encoder", /url(-?enc(oder)?)?/i],
    ["TOTPAuth", /totp(-?auth)?|auth/i],
  ].find(([_, regex]) => regex.test(path[1]))?.[0] || path[1];
  if (p.toLowerCase() != path[1].toLowerCase()) {
    path[1] = p;
    window.location = path.join("/");
  }
</script>
